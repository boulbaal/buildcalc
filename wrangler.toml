# BuildCalc: puur statische site op Cloudflare Workers (Static Assets), zelfde account als Whenly.
# Geen worker-code, geen database: Cloudflare serveert de map public/ die tools/build.mjs maakt.
name = "buildcalc"
compatibility_date = "2026-09-01"

[assets]
directory = "./public"
# Onbekende URL: dichtstbijzijnde 404.html (dus /nl/xyz toont de Nederlandse 404-pagina)
not_found_handling = "404-page"
html_handling = "auto-trailing-slash"
